name: Organization Ledger Writer

# InTr mesh path writers of this organization's .github (Lane B, StegVerse-org/.github#162).
# Jobs are taken unchanged from SV-LLM/.github#54 @a4653826 organization-ledger-writer.yml
# (model: StegVerse-org/.github main 575c520d), minus `plan` and `ledger-transition`:
# this repository keeps its existing organization-ledger-transition.yml for that.
#   merge-transfer  every push to main
#   path-transfer   after a successful merge-transfer (.stegverse/intr-path-transfer/transfers.json)
#   path-ingress    after a successful merge-transfer (.stegverse/intr-path-transfer/inbound.json)
# Push to main only: no workflow_dispatch, no schedule, no cross-repository call. Each job
# appends with this run's GITHUB_TOKEN to this organization's own ledger ref, fast-forward only.
# Inbound sources are read anonymously (public .github ledgers, E0); no credential is held.
# SKAP invariant: the SKAP Vault inside KV is the only store of PII and credentials for every
# user, the ecosystem's own included; nothing here reads, mints or stores one.
on:
  push:
    branches: [main]

permissions:
  contents: read

# ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with organization-ledger-transition.yml.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  # Folded from .github/workflows/organization-ledger-merge-transfer.yml (job `append`).
  # A merge on main is a state transition within this organization
  # (.stegverse/transition-ledger/org-contract.json organization_scope_rule:
  # EVERY_STATE_TRANSITION_OCCURRING_WITHIN_THE_ORGANIZATION_EMITS_AN_ORGANIZATION_RECEIPT).
  # The push that lands the merge is the trigger. There is no dispatch, schedule
  # or cross-repository call: the append is made in this repository, onto this
  # organization's own designated ledger ref, with this run's GITHUB_TOKEN.
  #
  # Each merge gets one repository receipt and one organization receipt through
  # the existing two-level append (resident-runtime/intr_destination_ingress.py
  # _append over emit.py / aggregate_repo_transition.py / ledger_store.py),
  # operation ORGANIZATION_MAIN_MERGE_TRANSFER, at the supplied epoch carried by
  # the ledger head (no clock). The transfer is VERIFIED only by
  # resident-runtime/merge_transfer.py verify on a fresh fetch of the published
  # ref; this run's success is not the evidence.
  #
  # Writer only. The PR-facing checks are
  # .github/workflows/organization-ledger-merge-transfer-validation.yml.
  # ORGANIZATION_LEDGER_LOCK: one appender at a time, shared with
  # organization-ledger-transition.yml. The fast-forward push is the
  # compare-and-swap against the published ref.
  merge-transfer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          ref=$(python3 -c 'import json; print(json.load(open(".stegverse/transition-ledger/org-contract.json")).get("organization_ledger_ref") or "refs/stegverse/organization-ledger")')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          # No head, no supplied epoch: the append below refuses (HB_EPOCH_SOURCE_UNOBSERVED).
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"

      - name: Select the merges this push carries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          # pending merges, then the push's base when it is on main with no receipt, then the pushed range
          # (resident-runtime/merge_transfer_range.py); the base is checked on the ledger about to be appended to
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer_range.py --before "$BEFORE" --after "$GITHUB_SHA" \
            --pending .stegverse/merge-transfer/pending.json > "$RUNNER_TEMP/results/commits.txt"
          cat "$RUNNER_TEMP/results/commits.txt"

      - name: Append each merge's repository and organization receipts
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer.py append --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run the push)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a merge already ledgered is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each transfer from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/merge_transfer.py verify --commits-file "$RUNNER_TEMP/results/commits.txt" \
            --out "$RUNNER_TEMP/results/verify.json"
          { echo '### main merge transfer'; echo '```json'; cat "$RUNNER_TEMP/results/verify.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-merge-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-transfer.yml (job `append`).
  # A transfer over a declared InTr mesh path is a state transition within this
  # organization. Landing a row of .stegverse/intr-path-transfer/transfers.json on
  # main is the transition; the push that lands it is ledgered first by
  # organization-ledger-merge-transfer.yml, and this writer runs when that
  # workflow completes for a push to main (workflow_run: an event of the push,
  # not a dispatch; there is no workflow_dispatch, schedule or cross-repository
  # call). Each declared transfer not yet ledgered gets one repository receipt and
  # one organization receipt (operation INTR_MESH_PATH_TRANSFER) through the
  # existing two-level append, at the supplied epoch on the ledger head (no clock),
  # linked to the push's main-merge transfer receipt. A transfer already ledgered
  # is answered from the ledger. Path receipts are verified by
  # resident-runtime/intr_path_transfer.py verify on a fresh fetch of the
  # published ref; the destination half stays FAIL_CLOSED class B until a carrier
  # and a TV/TVC-issued cross-organization read credential exist.
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-transfer:
    needs: [merge-transfer]
    if: needs.merge-transfer.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      TRANSFER_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Append each declared path transfer, linked to this push's main-merge transfer
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py append --transfer-commit "$TRANSFER_COMMIT" \
            --out "$RUNNER_TEMP/results/append.json"

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered path transfer is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each path from a fresh fetch of the published ref
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_transfer.py verify --expect-source ALLOW --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(json.dumps(r["counts"]))' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-transfer-${{ github.sha }}
          path: ${{ runner.temp }}/results

  # Folded from .github/workflows/intr-path-ingress.yml (job `append`).
  # The destination half of an InTr mesh path. A row of
  # .stegverse/intr-path-transfer/inbound.json landing on this organization's main
  # carries copies of a source organization's sealed path receipts; landing it is
  # the transition. This writer runs when organization-ledger-merge-transfer.yml
  # completes for that push (workflow_run: an event of the push, not a dispatch;
  # no workflow_dispatch, schedule or cross-repository call). Each carried pair
  # that is sealed, linked and names this destination is consumed by
  # resident-runtime/intr_path_ingress.py through the destination ingress
  # two-level append (operation ORGANIZATION_INTR_DESTINATION_INGRESS, supplied
  # epoch on the ledger head, no clock); the receipts carry both source seals. A
  # row already ledgered is answered from the ledger. The carried pair's inclusion
  # in the source ledger is read anonymously when the source's .github is public
  # (E0, no credential); otherwise it is recorded FAIL_CLOSED
  # INTR_PATH_CROSS_ORG_READ_CREDENTIAL_NOT_ISSUED (TV/TVC route).
  #
  # Writer only. The PR-facing checks are intr-path-transfer-validation.yml.
  path-ingress:
    needs: [merge-transfer, path-transfer]
    if: ${{ !cancelled() && needs.merge-transfer.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bind the designated organization ledger ref and the repository ledger subtree
        run: |
          set -euo pipefail
          namespace=$(python3 -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
          echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          mkdir -p "$RUNNER_TEMP/results"

      - name: Read each inbound row's source ledger anonymously (public sources only; no credential)
        run: |
          set -euo pipefail
          pub="$RUNNER_TEMP/public-ledgers"; mkdir -p "$pub"; echo "STEGVERSE_INTR_PUBLIC_LEDGERS=$pub" >> "$GITHUB_ENV"
          [ -f .stegverse/intr-path-transfer/inbound.json ] || exit 0
          for org in $(python3 -c 'import json; print(" ".join(sorted({r["path_id"].split("->")[0] for r in json.load(open(".stegverse/intr-path-transfer/inbound.json"))["transfers"]})))'); do
            git init -q --bare "$pub/$org.git"
            if ! GIT_TERMINAL_PROMPT=0 git --git-dir="$pub/$org.git" -c credential.helper= -c http.https://github.com/.extraheader= \
                fetch -q --no-tags "https://github.com/$org/.github" "+$LEDGER_REF:$LEDGER_REF"; then
              rm -rf "$pub/$org.git"; echo "NOT_ANONYMOUSLY_READABLE $org (TV/TVC route applies; FAIL_CLOSED until a TVC read receipt verifies)"
            fi
          done

      - name: Consume each inbound row through the destination ingress
        run: |
          set -euo pipefail
          if [ ! -f .stegverse/intr-path-transfer/inbound.json ]; then
            echo "no inbound rows; no transition"; echo "NO_INBOUND=1" >> "$GITHUB_ENV"; exit 0
          fi
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_ingress.py consume --out "$RUNNER_TEMP/results/consume.json"

      - name: Publish the ledger ref (fast-forward only)
        if: env.NO_INBOUND != '1'
        run: |
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-writer.yml (re-run)","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run; a ledgered inbound row is answered from the ledger"}'
            exit 1
          fi

      - name: Verify each inbound row from a fresh fetch of the published ref
        if: env.NO_INBOUND != '1'
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_HAS_CREDENTIALS","required_evidence_or_repair":"checkout credentials unavailable for an independent ref fetch","retry_entrypoint":".github/workflows/organization-ledger-writer.yml","owning_existing_goal":"StegVerse-org/.github#162","next_attempt":"re-run with repository contents permission"}'
            exit 1
          fi
          git --git-dir="$fresh" -c "http.https://github.com/.extraheader=$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          export STEGVERSE_ORG_LEDGER_ROOT="git+$fresh#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$fresh#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          python3 resident-runtime/intr_path_ingress.py verify --out "$RUNNER_TEMP/results/verify.json" > /dev/null
          python3 -c 'import json,sys; [print(r["disposition"], r["path_id"]) for r in json.load(open(sys.argv[1]))]' "$RUNNER_TEMP/results/verify.json"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intr-path-ingress-${{ github.sha }}
          path: ${{ runner.temp }}/results

