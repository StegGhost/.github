name: Manifest-Bound Conformance Validation

on:
  pull_request:
    paths:
      - data/organization-role-runtime-reality-deployment.json
      - data/organization-role-exemption-register.json
      - org-boundary/registry/services.json
      - org-boundary/runtime/manifest_selection.py
      - org-boundary/runtime/process_boundary.py
      - org-boundary/tests/test_manifest_bound_conformance.py
      - org-kernel/kernel.py
      - control/organization-runtime.json
      - resident-runtime/activation-manifest.json
      - .github/workflows/manifest-bound-conformance-validation.yml
  push:
    branches: [main]
    paths:
      - data/organization-role-runtime-reality-deployment.json
      - data/organization-role-exemption-register.json
      - org-boundary/registry/services.json
      - org-boundary/runtime/manifest_selection.py
      - org-boundary/runtime/process_boundary.py
      - org-boundary/tests/test_manifest_bound_conformance.py
      - org-kernel/kernel.py
      - control/organization-runtime.json
      - resident-runtime/activation-manifest.json
      - .github/workflows/manifest-bound-conformance-validation.yml
  workflow_dispatch:

# This repository is internal; an unpermissioned GITHUB_TOKEN cannot read it.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hold the declaration and the register to the standard they cite
        run: |
          set -eu
          python3 org-boundary/tests/test_manifest_bound_conformance.py
          python3 -m py_compile \
            org-boundary/runtime/manifest_selection.py \
            org-boundary/runtime/process_boundary.py \
            org-kernel/kernel.py

      - name: Prove the register is not optional paperwork
        run: |
          set -eu
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          # The register only means something if removing an entry fails the
          # build. Mutate a copy of the tree and require the check to catch it.
          # A conformance test that cannot fail is the silent non-conformance
          # it was written to prevent, wearing a green check.
          TEST = 'org-boundary/tests/test_manifest_bound_conformance.py'
          REGISTER = Path('data/organization-role-exemption-register.json')
          original = REGISTER.read_text(encoding='utf-8')

          def run():
              return subprocess.run([sys.executable, TEST],
                                    capture_output=True, text=True).returncode

          assert run() == 0, 'the conformance check does not pass at head'

          try:
              # Drop the entry registering the five refusing endpoints.
              document = json.loads(original)
              document['exemptions'] = [
                  entry for entry in document['exemptions']
                  if entry['exemption_id'] != 'SGHOST-EXEMPTION-002']
              REGISTER.write_text(json.dumps(document, indent=2), encoding='utf-8')
              assert run() != 0, \
                  'an unregistered refusing endpoint passed; the register is decorative'

              # Let an exemption await a machine, which the standard forbids.
              document = json.loads(original)
              document['exemptions'][0]['awaits_an_external_machine'] = True
              REGISTER.write_text(json.dumps(document, indent=2), encoding='utf-8')
              assert run() != 0, 'an exemption awaiting a machine passed'

              # Empty the register entirely.
              document = json.loads(original)
              document['exemptions'] = []
              REGISTER.write_text(json.dumps(document, indent=2), encoding='utf-8')
              assert run() != 0, 'an empty register passed'
          finally:
              REGISTER.write_text(original, encoding='utf-8')

          assert run() == 0, 'the tree was not restored'
          print('REGISTER_IS_LOAD_BEARING=PASS')
          PY

      - name: Assert no surface claims conformance it has not got
        run: |
          set -eu
          python3 - <<'PY'
          import json
          from pathlib import Path

          declaration = json.loads(Path(
              'data/organization-role-runtime-reality-deployment.json'
          ).read_text(encoding='utf-8'))
          register = json.loads(Path(
              'data/organization-role-exemption-register.json'
          ).read_text(encoding='utf-8'))

          # A declaration is not authority and an exemption is not a pass.
          # Three claims nothing in this organization may make.
          assert declaration['authority_effect'] == 'NONE_DECLARATION_ONLY'
          assert register['authority_effect'] == 'NONE_REGISTER_ONLY'
          assert register['exemption_grants_authority'] is False
          assert register['exemption_may_satisfy_a_terminal_predicate'] is False

          # The declaration is this organization's own. deployment_scope is
          # THIS_ORGANIZATION_ONLY, so a declaration naming another
          # organization's surfaces would be declaring on its behalf.
          scope = declaration['deployment_scope']
          assert scope.startswith('THIS_ORGANIZATION_ONLY'), scope
          assert declaration['organization'] == 'StegGhost'
          assert register['organization'] == 'StegGhost'

          # The sandbox route is architecture of record, not a running path.
          invariant = declaration['sandbox_path_invariant']
          assert invariant['legs_addressable_today'] == 0, \
              'if a leg became addressable, say so and retire its exemption'
          assert invariant['exemption_registered'] in {
              entry['exemption_id'] for entry in register['exemptions']}, \
              'the unaddressable sandbox leg must cite an exemption that exists'

          assert declaration['processing_selection']['route_owner'] == \
              'StegVerse-org/StegVerse-SDK', \
              'route installation is the SDK\'s; this boundary must not own it'
          assert declaration['processing_selection'][
              'route_installation_resolved_here'] is False
          print('NO_SURFACE_CLAIMS_CONFORMANCE_IT_HAS_NOT_GOT=PASS')
          PY

      - name: Record what this validation establishes and what it leaves open
        run: |
          echo 'MANIFEST_BOUND_CONFORMANCE_VALIDATION_PASS'
          echo 'This organization declares the standard EVERY_ACTION_IS_A_MANIFEST_BOUND_'
          echo 'STATE_TRANSITION_AND_NO_EXTERNAL_MACHINE_IS_AWAITED, selects processing'
          echo 'from the admitted manifest at both dispatch surfaces before any receipt'
          echo 'is minted, and registers every surface it carries that cannot yet satisfy'
          echo 'the standard. Each registered surface refuses immediately with a named'
          echo 'predicate; none queues, polls, or awaits a machine.'
          echo
          echo 'What a PASS does NOT mean: no registered surface works. No leg of the'
          echo 'canonical sandbox route is addressable at this organization today, the'
          echo 'origin attestation action cannot be reached here at all, and this'
          echo 'organization carries no task registry, so no existing goal owns any of'
          echo 'these surfaces. A PASS means the register is complete and honest as of'
          echo 'this commit, and that an unregistered non-conforming surface fails here.'
          echo
          echo 'Route installation is NOT resolved at this boundary. The capability-to-'
          echo 'processor table belongs to StegVerse-org/StegVerse-SDK, and a passing'
          echo 'selection records that rather than implying an installed route.'
          echo 'AUTHORITY_EFFECT=NONE_VALIDATION_ONLY'
