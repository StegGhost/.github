name: Validate Clock Marker Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'org-kernel/kernel.py'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/git_carrier.py'
      - 'org-boundary/schemas/intr-envelope.schema.json'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/activation-manifest.json'
      - '.github/workflows/resident-federation-cycle.yml'
      - 'runtime/organization_runtime.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/release_organization_batch.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'org-boundary/runtime/capability_ingress.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_clock_marker_probe.py'
      - '.github/workflows/clock-marker-probe-validation.yml'
      - 'tests/test_workflow_triggers.py'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'org-kernel/kernel.py'
      - 'org-boundary/runtime/intr_transport.py'
      - 'org-boundary/runtime/git_carrier.py'
      - 'org-boundary/schemas/intr-envelope.schema.json'
      - 'resident-runtime/federation_cycle.py'
      - 'resident-runtime/activation-manifest.json'
      - '.github/workflows/resident-federation-cycle.yml'
      - 'runtime/organization_runtime.py'
      - 'resident-runtime/aggregate_repo_transition.py'
      - 'resident-runtime/ledger_store.py'
      - 'resident-runtime/organization_egress_boundary.py'
      - 'resident-runtime/release_organization_batch.py'
      - 'resident-runtime/intr_destination_ingress.py'
      - 'org-boundary/runtime/capability_ingress.py'
      - '.stegverse/transition-ledger/emit.py'
      - 'tests/test_clock_marker_probe.py'
      - '.github/workflows/clock-marker-probe-validation.yml'
      - 'tests/test_workflow_triggers.py'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The clock is pinned and every route is run in temporary roots. Each
      # clock value written must be marked, and each receipt writer must refuse
      # an absent epoch or stamp the supplied one.
      - name: Fixed-clock probe of every route
        run: python -m unittest tests.test_clock_marker_probe -v
      # No workflow is triggered by hand or by a clock (B-P40, R-DISPATCH).
      - name: Workflow triggers are state transitions
        run: python -m unittest tests.test_workflow_triggers -v
