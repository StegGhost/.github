name: Organization Ledger Transition

# A committed request performs an intr-destination diagnostic self-closure:
# both ledger levels append receipts carrying communication_id, the designated
# ref (org-contract.json organization_ledger_ref) is published by a
# fast-forward-only push, and a fresh fetch reads the receipts back.
# The ledger is the evidence; this run's success is not.
# SGHOST-EXEMPTION-006 refuses the master-records handoff. This workflow does
# not perform that handoff.
#
# COMMITTED_REQUEST (B-P40, ruling R-DISPATCH; pattern of StegVerse-Labs/.github
# organization-ledger-transition.yml:18-25). The trigger is a push to main that
# changes the committed request file. There is no workflow_dispatch, schedule or
# cross-repository call, and the workflow takes no inputs: a run is a
# manifest-bound state transition, not a person's or a clock's (derived from
# StegVerse-Labs/.github@149f16e data/task-registry-global-invariants.json:54,58,60,120,160-161
# and data/sv-work-items/invariants.json:133; precedent
# tests/test_organization_ledger_transition_writer.py:254-257). The request file is:
#
#   .stegverse/organization-ledger-transition/request.json
#   {"schema_version": "stegverse.org-ledger-transition-request.v1",
#    "communication_id": "<printable, no '..', '/' or '\\'>",
#    "packet_id": "<optional; default organization-intr-destination-self-closure>",
#    "hb_epoch": "<ASCII digits, value >= 32>",
#    "ledger_head": "<40-hex sha on refs/stegverse/organization-ledger, or GENESIS before the ref exists>"}
#
# The ledger head the request names must be on the published ledger (the head or
# an ancestor of it): the merge-transfer writer appends on the same push, so the
# head may move between the commit and this run.
on:
  push:
    branches: [main]
    paths:
      - .stegverse/organization-ledger-transition/request.json

permissions:
  contents: write

# ORGANIZATION_LEDGER_LOCK: one appender at a time. The push below is the
# compare-and-swap against the published ref, so a writer that lost a race
# fails closed instead of overwriting.
concurrency:
  group: organization-ledger
  cancel-in-progress: false

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      LEDGER_REF: refs/stegverse/organization-ledger
      REQUEST: .stegverse/organization-ledger-transition/request.json
    steps:
      - name: Checkout organization boundary
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate the designated ref and the self-closure entrypoint before any append
        run: |
          python -m py_compile \
            resident-runtime/organization_ledger_readback.py \
            resident-runtime/intr_destination_ingress.py \
            resident-runtime/aggregate_repo_transition.py \
            resident-runtime/ledger_store.py \
            .stegverse/transition-ledger/emit.py
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path(".stegverse/transition-ledger/org-contract.json").read_text())
          assert contract["organization"] == "StegGhost"
          assert contract["organization_ledger_repository"] == "StegGhost/.github"
          assert contract["organization_ledger_ref"] == "refs/stegverse/organization-ledger"
          assert contract["organization_record_service_declared"] is False
          assert contract["organization_record_submission_disposition"].startswith("DENY_")
          assert "SGHOST-EXEMPTION-006" in contract["_why_the_submission_refuses_today"]
          location = json.loads(Path(".stegverse/transition-ledger/contract.json").read_text())["repository_ledger_location"]
          assert location["repository"] == contract["organization_ledger_repository"]
          assert location["ref"] == contract["organization_ledger_ref"]
          assert location["new_ledger_root"] is False and location["namespace"]
          PY

      - name: Bind the designated organization ledger ref and the repository ledger subtree within it
        run: |
          ref=$(python -c 'import json; c=json.load(open(".stegverse/transition-ledger/org-contract.json")); assert c["organization_ledger_repository"]=="StegGhost/.github", c; print(c["organization_ledger_ref"])')
          test "$ref" = "$LEDGER_REF"
          namespace=$(python -c 'import json; l=json.load(open(".stegverse/transition-ledger/contract.json"))["repository_ledger_location"]; assert l["ref"]=="refs/stegverse/organization-ledger", l; print(l["namespace"])')
          echo "REPO_LEDGER_NAMESPACE=$namespace" >> "$GITHUB_ENV"
          echo "repository ledger subtree: $namespace"
          if git ls-remote --exit-code origin "$LEDGER_REF" >/dev/null; then
            git fetch --no-tags origin "+$LEDGER_REF:$LEDGER_REF"
            echo "ledger tip: $(git rev-parse "$LEDGER_REF")"
          else
            echo "ledger ref not yet materialized; the first append opens it at genesis"
          fi

      # Time is supplied by the committed request. It is not sampled from a clock.
      # The epoch is refused by the kernel's shared rule (writer_epoch_refusal),
      # six-field FAIL_CLOSED, before the writer CLI runs; nothing is written.
      # An hb_epoch key that is missing or "" is HB_EPOCH_NOT_SUPPLIED.
      - name: Refuse an absent, invalid or stale committed request before any append
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, os, re, subprocess, sys
          entrypoint = ".github/workflows/organization-ledger-transition.yml"
          def refuse(code, predicate, detail, repair, goal="INTERLOCK-INTR-RUNTIME-INDEPENDENT-PROTOCOL-001"):
              print(json.dumps({"disposition": "FAIL_CLOSED", "failure_code": code,
                                "failed_predicate": predicate, "detail": detail,
                                "required_evidence_or_repair": repair,
                                "retry_entrypoint": entrypoint, "owning_existing_goal": goal,
                                "next_attempt": "commit a corrected request to main; nothing was written",
                                "derived_from_clock": False, "consequence_committed": False}, sort_keys=True))
              sys.exit(1)
          path = os.environ.get("REQUEST") or ".stegverse/organization-ledger-transition/request.json"
          if not os.path.isfile(path):
              refuse("LEDGER_TRANSITION_REQUEST_NOT_SUPPLIED", "COMMITTED_REQUEST_IS_PRESENT", path + " absent",
                     "commit " + path + " to main")
          def nonfinite(token):
              raise ValueError("non-finite number " + token + " is not JSON")
          def finite(token):
              value = float(token)
              if value != value or value in (float("inf"), float("-inf")):
                  nonfinite(token)
              return value
          # Strict and depth-bounded: NaN, Infinity and 1e999 are refused, and a deeply
          # nested document (RecursionError, MemoryError) is refused six-field,
          # never a traceback (B-P40 row 1).
          try:
              raw = open(path, "rb").read()
              request = json.loads(raw, parse_constant=nonfinite, parse_float=finite)
          except (OSError, ValueError, RecursionError, MemoryError) as error:
              refuse("LEDGER_TRANSITION_REQUEST_INVALID", "COMMITTED_REQUEST_IS_A_JSON_OBJECT", type(error).__name__,
                     "commit " + path + " as a JSON object")
          if not isinstance(request, dict):
              refuse("LEDGER_TRANSITION_REQUEST_INVALID", "COMMITTED_REQUEST_IS_A_JSON_OBJECT", type(request).__name__,
                     "commit " + path + " as a JSON object")
          hb_epoch = request.get("hb_epoch")
          if hb_epoch == "":
              hb_epoch = None
          try:
              spec = importlib.util.spec_from_file_location("kernel", "org-kernel/kernel.py")
              kernel = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(kernel)
              refusal = kernel.writer_epoch_refusal(hb_epoch, retry_entrypoint=entrypoint)
          except Exception as error:
              refuse("HB_EPOCH_GATE_UNAVAILABLE", "SUBMISSION_CARRIES_THE_SUPPLIED_HB_EPOCH", type(error).__name__,
                     "the committed request and org-kernel/kernel.py load")
          if refusal is not None:
              print(json.dumps(refusal, sort_keys=True))
              sys.exit(1)
          def printable(value):
              return isinstance(value, str) and bool(value.strip()) and all(32 <= ord(char) <= 126 for char in value)
          communication_id = request.get("communication_id")
          packet_id = request.get("packet_id") or "organization-intr-destination-self-closure"
          if communication_id in (None, ""):
              refuse("COMMUNICATION_ID_NOT_SUPPLIED", "COMMITTED_REQUEST_NAMES_THE_COMMUNICATION_ID",
                     "communication_id absent", "the request names the communication_id the closure correlates on")
          if not printable(communication_id) or not printable(packet_id) or any(
                  token in communication_id or token in packet_id for token in ("..", "/", "\\")):
              refuse("REQUEST_IDENTIFIER_INVALID", "COMMITTED_REQUEST_IDENTIFIERS_ARE_PRINTABLE_PATH_FREE",
                     "communication_id or packet_id", "printable ASCII without '..', '/' or '\\'")
          ledger_ref = os.environ.get("LEDGER_REF") or "refs/stegverse/organization-ledger"
          ledger_head = request.get("ledger_head")
          if ledger_head in (None, ""):
              refuse("LEDGER_HEAD_NOT_SUPPLIED", "COMMITTED_REQUEST_NAMES_THE_LEDGER_HEAD", "ledger_head absent",
                     "the request names the sha of " + ledger_ref + " it was made against (GENESIS before the ref exists)",
                     goal="STEGGHOST-ORGANIZATION-LEDGER-REF")
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).returncode == 0
          materialized = git("rev-parse", "--verify", "--quiet", ledger_ref + "^{commit}")
          on_ledger = (ledger_head == "GENESIS" and not materialized) or (
              materialized and isinstance(ledger_head, str) and re.fullmatch(r"[0-9a-f]{40}", ledger_head) is not None
              and git("merge-base", "--is-ancestor", ledger_head, ledger_ref))
          if not on_ledger:
              refuse("LEDGER_HEAD_INVALID", "COMMITTED_REQUEST_LEDGER_HEAD_IS_ON_THE_PUBLISHED_LEDGER",
                     repr(ledger_head) + " is not " + ledger_ref + " or an ancestor of it",
                     "re-commit the request against the current ledger head", goal="STEGGHOST-ORGANIZATION-LEDGER-REF")
          temp = os.environ.get("RUNNER_TEMP") or "."
          os.makedirs(temp + "/results/self-closure", exist_ok=True)
          open(temp + "/closure-id.txt", "w").write(communication_id + "\n" + packet_id + "\n")
          receipt = {"request_path": path, "request_sha256": "sha256:" + hashlib.sha256(raw).hexdigest(),
                     "request_commit": os.environ.get("GITHUB_SHA"), "ledger_head": ledger_head,
                     "hb_epoch": str(hb_epoch), "derived_from_clock": False}
          with open(temp + "/results/self-closure/request.json", "w") as out:
              json.dump(receipt, out, indent=2, sort_keys=True)
          if os.environ.get("GITHUB_ENV"):
              # Every writer this run invokes records the request it answers
              # (kernel.committed_request, B-P40 clause b).
              with open(os.environ["GITHUB_ENV"], "a") as env:
                  env.write("HB_EPOCH=" + str(hb_epoch) + "\n")
                  env.write("STEGVERSE_COMMITTED_REQUEST_PATH=" + path + "\n")
                  env.write("STEGVERSE_COMMITTED_REQUEST_SHA256=" + receipt["request_sha256"] + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Perform the intr-destination diagnostic self-closure
        run: |
          set -euo pipefail
          export STEGVERSE_ORG_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF"
          export STEGVERSE_REPO_LEDGER_ROOT="git+$GITHUB_WORKSPACE#$LEDGER_REF:$REPO_LEDGER_NAMESPACE"
          communication_id=$(sed -n '1p' "$RUNNER_TEMP/closure-id.txt")
          packet_id=$(sed -n '2p' "$RUNNER_TEMP/closure-id.txt")
          mkdir -p "$RUNNER_TEMP/results/self-closure"
          python resident-runtime/intr_destination_ingress.py \
            --self-close \
            --hb-epoch "$HB_EPOCH" \
            --communication-id "$communication_id" \
            --packet-id "$packet_id" \
            --registry org-boundary/registry/services.json \
            --out "$RUNNER_TEMP/results/self-closure/closure.json"
          python - "$RUNNER_TEMP/results/self-closure/closure.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1]))
          print("closure disposition:", result.get("disposition"), result.get("communication_id"), result.get("organization_receipt_sha256"))
          if result.get("disposition") != "ALLOW" or result.get("self_closure") is not True:
              raise SystemExit("FAIL_CLOSED: INTR_DESTINATION_SELF_CLOSURE_NOT_RECORDED")
          if not result.get("communication_id"):
              raise SystemExit("FAIL_CLOSED: CLOSURE_HAS_NO_COMMUNICATION_ID")
          if not result.get("repository_receipt_observed") or not result.get("organization_receipt_observed"):
              raise SystemExit("FAIL_CLOSED: CLOSURE_MISSING_A_LEDGER_RECEIPT")
          PY

      - name: Publish the ledger ref (fast-forward only)
        run: |
          if ! git rev-parse --verify --quiet "$LEDGER_REF" >/dev/null; then
            echo "nothing appended; ledger ref not materialized"; exit 1
          fi
          if ! git push origin "$LEDGER_REF:$LEDGER_REF"; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"ORGANIZATION_LEDGER_PUBLISH_RACE","failed_predicate":"PUBLISHED_REF_FAST_FORWARDS","required_evidence_or_repair":"another append moved the ref first; this run published nothing","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"STEGGHOST-ORGANIZATION-LEDGER-REF","next_attempt":"re-run; the same communication_id and packet_id are answered from the ledger if already recorded"}'
            exit 1
          fi

      - name: Read the organization and repository ledgers back from a fresh fetch
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/readback.git"
          git init -q --bare "$fresh"
          auth_header=$(git config --local --get http.https://github.com/.extraheader || true)
          if [ -z "$auth_header" ]; then
            echo '{"disposition":"FAIL_CLOSED","failure_code":"AUTHENTICATED_LEDGER_READBACK_UNAVAILABLE","failed_predicate":"FRESH_FETCH_AUTHENTICATED","required_evidence_or_repair":"checkout credentials unavailable for independent ledger ref fetch","retry_entrypoint":".github/workflows/organization-ledger-transition.yml","owning_existing_goal":"STEGGHOST-ORGANIZATION-LEDGER-REF","next_attempt":"retry with an authorized repository contents token"}'
            exit 1
          fi
          git --git-dir="$fresh" -c http.https://github.com/.extraheader="$auth_header" fetch -q "$(git remote get-url origin)" "+$LEDGER_REF:$LEDGER_REF"
          python resident-runtime/organization_ledger_readback.py \
            --location "git+$fresh#$LEDGER_REF" \
            --closure-result "$RUNNER_TEMP/results/self-closure/closure.json" \
            --repository-namespace "$REPO_LEDGER_NAMESPACE" \
            --out "$RUNNER_TEMP/results/self-closure/readback.json"
          {
            echo "### intr-destination self-closure"
            echo '```json'
            cat "$RUNNER_TEMP/results/self-closure/readback.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the run's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organization-ledger-transition
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
